[uwsgi]

uid = www-data        ;  你的用户 | user
gid = www-data        ;  用户组   | group

chmod-socket = 664
chown-socket = www-data:www-data

; 设置项目的路径 | Set the project directory
basedir = ...your project directory...  (like:  .../mokmedia)

socket = %(basedir)/mokmedia.sock

chdir = %(basedir)

wsgi-file = %(basedir)/run.py

callable = app

; 如果使用了虚拟环境，设置虚拟环境的路径  |  Virtual environment directory (optional)
virtualenv = ...your path...  (like:  /.pyenv/versions/mokmedia)

systemd-notify = true

master = True
processes = 3 
threads = 2
enable-threads = false     ; 启用线程支持,这是python的线程
need-app = true
max-requests = 500         ; 每个进程处理500请求后重启 (防内存泄漏)
max-worker-lifetime = 3600 ; 工作进程最大存活时间(秒)
reload-on-as = 1024        ; 内存超过1024MB时重启进程
reload-on-rss = 768        ; RSS内存超过768MB时重启进程
harakiri = 30              ; 请求超时时间(秒)
harakiri-verbose = false


vacuum = true 
http-timeout = 40
socket-timeout = 10 

; --------------------------
; 日志管理（避免磁盘占满）  |  Log
; --------------------------
logto = /var/log/uwsgi/mokmedia.log
log-maxsize = 10485760     ; 单日志文件最大10MB
log-backupname = /var/log/uwsgi/mokmedia_%n.log ; 日志轮转

